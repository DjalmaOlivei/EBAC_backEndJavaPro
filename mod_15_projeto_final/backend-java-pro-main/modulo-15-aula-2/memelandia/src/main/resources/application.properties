# Propriedades do banco de dados MySQL entidade usuario
spring.db1.datasource.jdbc-url=jdbc:mysql://localhost:3306/memelandia?useSSL=false&serverTimezone=UTC
spring.db1.datasource.username=admin
spring.db1.datasource.password=admin
spring.db1.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Propriedades do banco de dados MongoDB entidades meme e categoriameme
spring.db2.datasource.url=mongodb://localhost:27017/memelandia
spring.db2.datasource.username=admin
spring.db2.datasource.password=admin
Spring.db2.datasource.driver-class-name=com.mongodb.client.MongoClient

spring.jpa.hibernate.ddl-auto=none